
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'DORA SHOP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f3ed;color:#594536;font-family:Tahoma}
header{text-align:center;background:#e8dac9;padding:35px 10px;border-bottom:2px solid #b99b70}
header h1{font-family:Georgia;font-size:34px;letter-spacing:3px}
nav{text-align:center;padding:18px;background:#fffaf5}
nav a{color:#75583e;text-decoration:none;margin:12px}
.hero{text-align:center;padding:35px 12px}
#products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,300px));justify-content:center;gap:20px;padding:15px}
.product{background:white;padding:20px;text-align:center;border-radius:15px;box-shadow:0 5px 20px #0001}
.product img{width:100%;height:190px;object-fit:contain;border-radius:10px}
.price{color:#987044;font-size:20px;font-weight:bold}
.btn{display:inline-block;background:#806344;color:white;padding:12px 22px;border-radius:25px;text-decoration:none}
footer{text-align:center;padding:25px;background:#e8dac9;margin-top:30px}
</style>
</head>
<body>
<header>
<h1>L'DORA SHOP</h1>
<p>زیبایی، ظرافت و مراقبت از پوست</p>
</header>
<nav>
<a href="#">صفحه اصلی</a>
<a href="#products">محصولات</a>
<a href="#contact">تماس با ما</a>
</nav>
<section class="hero">
<h2>به دنیای زیبایی لدورا خوش آمدید</h2>
<p>محصولات زیبایی و مراقبت از پوست</p>
</section>
<section id="products"></section>
<footer id="contact">
<p>L'DORA SHOP</p>
<a class="btn" href="https://wa.me/989384152706">ارتباط با واتساپ</a>
</footer>
<script>
function showProducts(){
 const products=JSON.parse(localStorage.getItem("ldoraProducts")||"[]");
 const area=document.getElementById("products");
 const defaultProduct={
 name:"کرم لیفتینگ صورت لدورا",
 price:1000000,
 description:"محصول مراقبت از پوست",
 photo:""
 };
 const all=[defaultProduct,...products];
 area.innerHTML=all.map(p=>`
 <div class="product">
 ${p.photo?`<img src="${p.photo}" alt="">`:"<div style='font-size:65px;padding:45px'>🌸</div>"}
 <h3>${escapeText(p.name)}</h3>
 <p>${escapeText(p.description||"")}</p>
 <p class="price">${Number(p.price).toLocaleString("fa-IR")} تومان</p>
 <a class="btn" href="https://wa.me/989384152706?text=${encodeURIComponent("سلام، سفارش "+p.name+" را دارم.")}">سفارش در واتساپ</a>
 </div>`).join("");
}
function escapeText(value){
 return String(value).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
showProducts();
</script>
</body>
</html>
